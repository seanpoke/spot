# =============================================================================
# 前端构建：在 GitHub 的 runner 上打包，产出 dist 作为 Artifact 供下载
# -----------------------------------------------------------------------------
# 为什么不直接部署到服务器：dist 要落到宿主机 /home/ubuntu/app/visit/dist，
# 而那是 nginx 容器的 bind mount，跟后端镜像无关。手动 scp 一次最省事，
# 以后想自动化再加 SSH 私钥 + rsync 步骤。
#
# 构建时注入的值来自仓库 Secrets（Settings → Secrets and variables → Actions）：
#   VITE_AMAP_KEY              必填，否则地图白屏
#   VITE_AMAP_SECURITY_CODE    必填（JS API 2.0 的安全密钥）
#   VITE_AMAP_STYLE            可选，留空用内置浅色底图
# 这些值会被打进 JS，本来就是公开的；放 Secrets 只是避免写死在仓库里。
#
# 下载：Actions → 这次运行 → 页面底部 Artifacts → visit-dist.zip
# =============================================================================

name: Frontend Build

on:
  push:
    branches: ["main"]
    paths:
      - 'frontend/**'
  # 手工重建入口：只改了 Secrets / 需要重发同一个 commit 时用
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # build 脚本是 vue-tsc --noEmit && vite build，类型错误会直接让构建失败
      - name: Build
        working-directory: frontend
        env:
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
          VITE_AMAP_STYLE: ${{ secrets.VITE_AMAP_STYLE }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: visit-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
